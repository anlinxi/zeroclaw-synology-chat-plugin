# Standalone crate (own [workspace]): built for wasm32-wasip2 as a channel
# plugin component; the pure `synology-chat` core (rlib) is host-tested with
# plain `cargo test`. HTTP outbound uses the wasm-only `waki` client.
[package]
name = "synology-chat"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Synology Chat channel plugin for ZeroClaw: webhook ingress + outbound replies via Synology Chat External API."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
[workspace]
